<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog | Mangaldeep Singh</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="blog">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Go to home">
        <span class="brand-mark">YN</span>
        <span>Mangaldeep Singh</span>
      </a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="projects.html" data-nav="projects">Projects</a>
        <a href="resume.html" data-nav="resume">Resume</a>
        <a href="blog.html" data-nav="blog">Blog</a>
        <a href="hosting.html" data-nav="hosting">Host ML Demos</a>
      </nav>
    </header>

    <main>
      <section class="page-hero">
        <p class="eyebrow">Writing</p>
        <h1>Blog</h1>
        <p>Posts and language tutorials .</p>
      </section>
      <section class="section">
        <div class="writing-shell">
          <aside class="filters" aria-label="Post filters">
            <button class="filter-button active" data-filter="all">All</button>
            <button class="filter-button" data-filter="blog">Blog posts</button>
            <button class="filter-button" data-filter="tutorial">Tutorials</button>
            <label>
              <span>Language</span>
              <select id="language-filter">
                <option value="all">All languages</option>
              </select>
            </label>
          </aside>
          <div id="post-list" class="post-list" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>&copy; <span id="year"></span> Mangaldeep Singh</span>
      <!-- <span>Built for GitHub Pages</span> -->
    </footer>

    <script src="assets/markdown.js"></script>
    <script src="assets/app.js"></script>
