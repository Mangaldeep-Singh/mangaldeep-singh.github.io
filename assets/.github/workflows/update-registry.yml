name: Auto-Update Markdown Registries

on:
  push:
    paths:
      - 'content/projects/*.md'
      - 'content/posts/*.md'
    branches:
      - main

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate JSON files
        run: |
          # Generate projects.json (creates a JSON array of filenames without the .md extension)
          jq -n -c '[inputs | sub(".md$"; "")]' < <(ls -1 content/projects/*.md 2>/dev/null | xargs -n 1 basename) > content/projects.json || echo "[]" > content/projects.json
          
          # Generate posts.json
          jq -n -c '[inputs | sub(".md$"; "")]' < <(ls -1 content/posts/*.md 2>/dev/null | xargs -n 1 basename) > content/posts.json || echo "[]" > content/posts.json

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/projects.json content/posts.json
          # Only commit if the JSON files actually changed
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update JSON registries"
          git push
